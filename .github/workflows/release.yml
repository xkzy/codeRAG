name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    goos: linux,   goarch: amd64, ext: tar.gz}
          - {os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: tar.gz}
          - {os: macos-15-intel,   goos: darwin,  goarch: amd64, ext: tar.gz}
          - {os: macos-latest,     goos: darwin,  goarch: arm64, ext: tar.gz}
          - {os: windows-latest,   goos: windows, goarch: amd64, ext: zip}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # tree-sitter needs CGO, so each platform is built natively.
      - name: Test
        shell: bash
        run: go test ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          bin=codergag; [ "${{ matrix.goos }}" = windows ] && bin=codergag.exe
          go build -trimpath -ldflags "-s -w" -o "$bin" ./cmd/codergag
          name="codergag_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" "$bin" README.md LICENSE >/dev/null
          else
            tar czf "$name.tar.gz" "$bin" README.md LICENSE
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
