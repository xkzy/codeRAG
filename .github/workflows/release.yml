name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    goos: linux,  goarch: amd64, ext: tar.gz}
          - {os: ubuntu-24.04-arm, goos: linux,  goarch: arm64, ext: tar.gz}
          - {os: macos-15-intel,   goos: darwin, goarch: amd64, ext: tar.gz}
          - {os: macos-latest,     goos: darwin, goarch: arm64, ext: tar.gz}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # tree-sitter needs CGO, so each platform is built natively.
      # Linux binaries are static (musl) so they run on any distribution.
      - name: Install musl
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Tests gate the release on Linux only; the macOS runners differ in
      # /var -> /private/var symlink handling that some tests compare literally.
      - name: Test
        if: matrix.goos == 'linux'
        run: go test ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "${{ matrix.goos }}" = linux ]; then
            export CC=musl-gcc
            go build -trimpath -ldflags '-s -w -linkmode external -extldflags "-static" -X main.Version=${{ github.ref_name }}' -o codergag ./cmd/codergag
            if ldd codergag 2>&1 | grep -qv "not a dynamic"; then echo "binary is not static"; ldd codergag; exit 1; fi
          else
            go build -trimpath -ldflags '-s -w -X main.Version=${{ github.ref_name }}' -o codergag ./cmd/codergag
          fi
          name="codergag_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar czf "$name.tar.gz" codergag README.md LICENSE
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
